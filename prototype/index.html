<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阿财 · 介绍页原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="intro">
    <header class="topbar topbar-intro">
      <a class="brand-lockup" href="./index.html">
        <span class="brand-mark">阿财</span>
        <span class="brand-sub">公开信息选股条件整理</span>
      </a>
      <nav class="intro-nav" aria-label="首页导航">
        <a class="intro-nav-link is-current" href="./index.html">产品</a>
        <a class="intro-nav-link" href="./about.html">关于阿财</a>
      </nav>
    </header>

    <main>
      <section class="screen screen-intro">
        <div class="screen-shell intro-shell">
          <div class="intro-copy">
            <div class="intro-hero-row" aria-hidden="true">
              <div class="intro-mascot-wrap">
                <div class="hero-glow"></div>
                <img
                  class="intro-mascot"
                  src="../../Downloads/橘猫品牌吉祥物设计.png"

              先帮你判断条件是否合理，再把值得继续研究的方向递到你面前。
            </p>

            <div class="intro-foot">
              <div class="action-row">
                <a class="button button-primary button-hero" href="./form.html">开始筛选</a>
              </div>
            </div>
          </div>

          <p class="risk-note intro-legal">
            风险提示：页面只展示条件整理与公开信息匹配过程，不承诺收益，也不替代你的独立判断。
          </p>
        </div>
      </section>

    <script src="./script.js"></script>
